# Render Blueprints — deploys server.js (Express) as a Web Service.
# Docs: https://render.com/docs/blueprint-spec
# 1. Push this repo to GitHub.
# 2. Render Dashboard → New → Blueprint → pick the repo.
# 3. Fill the secret env vars in the dashboard (see DEPLOY.md).
# 4. After first deploy, copy the service URL (e.g. https://cyrils-foods.onrender.com)
#    into config.js (API_BASE) and redeploy Netlify / push the change.
services:
  - type: web
    name: cyrils-foods
    runtime: node
    plan: free
    region: frankfurt        # closest to Nigeria; change if you prefer
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Public base URL of THIS backend (Render service URL). Used to build links.
      - key: PUBLIC_URL
        value: https://cyrils-foods.onrender.com
      # The customer-facing static site (Netlify). Magic links redirect here.
      - key: FRONTEND_URL
        value: https://cyrilfoods.netlify.app
      # Origins allowed to call the API. Netlify + custom domain.
      - key: CORS_ORIGIN
        value: https://cyrilfoods.netlify.app,https://cyrilsfood.com.ng,https://www.cyrilsfood.com.ng
      # Staff authorized emails (comma-separated, case-insensitive).
      - key: KITCHEN_EMAILS
        value: kitchen@cyrilfoods.com.ng,michaelnwankwo186@gmail.com
      # --- Secret values: set these in the Render dashboard (Sync: Off) ---
      - key: TOKEN_SECRET
        sync: false          # long random string, e.g. `openssl rand -hex 32`
      - key: PAYSTACK_SECRET_KEY
        sync: false          # sk_live_... (or sk_test_... while testing)
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      # Email delivery for magic links (Resend/Brevo/Mailgun webhook).
      # Without this, links are printed to the Render logs (usable for testing).
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: EMAIL_WEBHOOK_KEY
        sync: false
      # WhatsApp order alerts (optional — wa.me fallback always works).
      - key: WHATSAPP_ALERT_TO
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
